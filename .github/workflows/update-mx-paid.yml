name: Update data - Tablero MX Paid Media

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download data.json from Google Drive
        run: |
          curl -L "https://drive.google.com/uc?export=download&id=${{ secrets.PAID_MEDIA_FILE_ID }}" \
            -o data.json --max-time 60 --retry 3
          python3 -c "import json; d=json.load(open('data.json')); print('OK:', d.get('registros','?'), 'registros')"

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: auto-update data.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push origin main
          fi