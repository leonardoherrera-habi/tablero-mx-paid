name: Actualizar tablero MX Paid Media

# Workflow del tablero-mx-paid: corre query consolidada contra BQ y regenera
# data.json. Necesita los secrets GCP_CREDENTIALS (service account JSON) y
# GCP_PROJECT en Settings → Secrets and variables → Actions.

on:
  schedule:
    - cron: '30 13 * * *'  # 7:30 AM México (UTC-6)
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: 'Trigger manual (sin afectar otros tableros)'
        required: false
        default: 'manual'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # gcloud y bq vienen preinstalados en ubuntu-latest. No usamos
      # setup-gcloud@v2 porque exige auth@v2, que no acepta authorized_user JSON.
      - name: Authenticate with user credentials (authorized_user JSON)
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          printf '%s' "$GCP_CREDS" > "$HOME/adc.json"
          gcloud auth login --cred-file="$HOME/adc.json" --quiet
          gcloud config set project "${{ secrets.GCP_PROJECT }}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/adc.json" >> "$GITHUB_ENV"
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$HOME/adc.json" >> "$GITHUB_ENV"

      - name: Query MX Paid Media
        run: |
          bq query --use_legacy_sql=false --format=json --max_rows=500000 < query.sql > /tmp/mx_paid_raw.json

      - name: Process data.json
        run: |
          python3 -c "
          import json
          with open('/tmp/mx_paid_raw.json') as f:
              raw = json.load(f)
          int_keys = ('fid','imp','clk','cre','cal','asg','cit','cie')
          rows = []
          for r in raw:
              row = {
                  'd': r['d'],
                  'fid': int(r['fid']),
                  'pl': r.get('pl') or None,
                  'cmp': r.get('cmp') or None,
                  'sub': r.get('sub') or None,
                  'imp': int(r['imp']),
                  'clk': int(r['clk']),
                  'spend': round(float(r.get('spend') or 0), 2),
                  'cre': int(r['cre']),
                  'cal': int(r['cal']),
                  'asg': int(r['asg']),
                  'cit': int(r['cit']),
                  'cie': int(r['cie']),
              }
              rows.append(row)
          with open('data.json', 'w') as f:
              json.dump(rows, f, separators=(',', ':'))
          spend_rows = sum(1 for r in rows if r['spend'] > 0 or r['imp'] > 0)
          lead_rows  = sum(1 for r in rows if r['cre']   > 0)
          print(f'Total rows: {len(rows)} | spend: {spend_rows} | leads: {lead_rows}')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update tablero-mx-paid data.json $(date -u +%Y-%m-%d)"
            git push
          fi
