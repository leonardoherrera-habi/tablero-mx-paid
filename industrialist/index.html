<style>
:root{--bg:#f6f7f8;--panel:#fff;--fg:#1b1f24;--muted:#5d6670;--line:#dfe3e7;--accent:#2f5d8a;--bad:#b42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111417;--panel:#191d21;--fg:#e8ebee;--muted:#9aa4ae;--line:#2b3238;--accent:#8db4dc;--bad:#f97066;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
.box{width:min(100%,24rem);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:14px}
h1{font:400 1.6rem/1.15 Georgia,"Times New Roman",serif;margin:0}
p{margin:0;color:var(--muted);font-size:.88rem}
label{font-size:.8rem;color:var(--muted)}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;padding:10px 12px;border:0;border-radius:8px;background:var(--accent);color:var(--panel);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
</style>
</head>
